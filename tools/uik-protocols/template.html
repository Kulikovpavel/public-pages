<title>Протоколы УИК</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --ink:#18202e; --muted:#5b6475; --faint:#8a92a3;
  --line:#dde2ea; --line-soft:#eceff4; --hover:#eef2f8; --focus:#2554c7;
  --c-pw:#2554c7; --c-er:#7f9be0; --c-pk:#d9661a; --c-tp:#7a52b8;
  --warn:#b4541a;
  --font:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141b; --surface:#171d27; --ink:#e4e8ef; --muted:#9aa3b4; --faint:#6d7688;
    --line:#2a3240; --line-soft:#212835; --hover:#1f2735; --focus:#7ea0ff;
    --c-pw:#6e93ff; --c-er:#a6b9ee; --c-pk:#ff9447; --c-tp:#b691ec; --warn:#f0a068;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141b; --surface:#171d27; --ink:#e4e8ef; --muted:#9aa3b4; --faint:#6d7688;
  --line:#2a3240; --line-soft:#212835; --hover:#1f2735; --focus:#7ea0ff;
  --c-pw:#6e93ff; --c-er:#a6b9ee; --c-pk:#ff9447; --c-tp:#b691ec; --warn:#f0a068;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
.wrap{max-width:1400px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.sub a{color:var(--c-pw);text-underline-offset:3px}
.lblrow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lblrow label{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lblrow a{font-size:12px;color:var(--c-pw);text-underline-offset:3px;white-space:nowrap}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

.filters{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px 18px;align-items:end}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f > label,.f > .lbl{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:6px}
.f.wide{grid-column:span 2}
@media (max-width:560px){.f.wide{grid-column:auto}}
select,input[type=text],input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;width:100%;min-width:0}
input[type=number]{font-family:var(--mono);font-size:13px}
select:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.tikrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:6px}
@media (max-width:560px){.tikrow{grid-template-columns:1fr}}
.range{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;color:var(--faint)}
.sw{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.checks{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding-block:6px}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
button{font:inherit;cursor:pointer;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 11px}
button:hover{background:var(--hover)}
.ghost{border-color:transparent;color:var(--muted);background:transparent}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;color:var(--muted)}
.crumbs button{padding:2px 6px;border:none;background:none;color:var(--c-pw);text-decoration:underline;text-underline-offset:3px}
.crumbs .cur{color:var(--ink);font-weight:600}

.stats{display:flex;flex-wrap:wrap;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{flex:1 1 130px;padding:10px 14px;border-right:1px solid var(--line-soft);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat:last-child{border-right:none}
.stat .k{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .v{font-family:var(--mono);font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .n{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px}
.panel-h h2{font-size:15px;font-weight:600;margin:0}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend button{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:99px;font-size:13px}
.legend button[aria-pressed=false]{opacity:.45}
.legend button[aria-pressed=false] .sw{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--faint)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:4px 10px;font-size:13px}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.chartbox{position:relative;height:380px}
.chartbox canvas{position:absolute;inset:0;width:100%;height:100%}
.hint{font-size:12px;color:var(--faint)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 20px rgba(10,20,40,.14);min-width:240px;max-width:340px;z-index:5}
.tip b{font-weight:600}
.tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tip .r > span:first-child{display:flex;gap:6px;align-items:center;color:var(--muted);min-width:0}
.tip .r > .num{white-space:nowrap;flex:none}
.tip .t{font-size:11px;color:var(--muted);margin-bottom:4px}
.tip .flag{color:var(--warn);font-size:11px;margin-top:4px}
.empty{padding:40px 0;text-align:center;color:var(--muted)}

.tscroll{overflow-x:auto;border:1px solid var(--line-soft);border-radius:8px}
table{border-collapse:collapse;font-size:12.5px}
th,td{padding:5px 8px;white-space:nowrap;border-bottom:1px solid var(--line-soft)}
.grid th{position:sticky;left:0;background:var(--surface);text-align:left;font-weight:500;color:var(--muted);z-index:1;border-right:1px solid var(--line)}
.grid td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:52px}
.grid thead td{font-weight:600;color:var(--ink);background:var(--bg)}
.grid td.hl{outline:2px solid var(--ink);outline-offset:-2px}
.grid td.deg{color:var(--warn)}
.groups{width:100%}
.groups th{text-align:right;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;background:var(--bg)}
.groups th:first-child,.groups td:first-child{text-align:left}
.groups th[aria-sort]::after{content:" ↓"}
.groups th[aria-sort=ascending]::after{content:" ↑"}
.groups td{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.groups td:first-child{font-family:var(--font);white-space:normal;min-width:220px}
.groups tbody tr{cursor:pointer}
.groups tbody tr:hover{background:var(--hover)}
.bar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:6px;opacity:.85}
#uikPanel{gap:14px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.card-h h2{font-size:18px;font-weight:700;margin:0}
.card-h .sub a{color:var(--c-pw)}
.card-close{font-size:18px;line-height:1;padding:4px 10px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--hover);color:var(--muted)}
.tag.warn{color:var(--warn)}
.tag b{color:var(--ink);font-weight:600;font-family:var(--mono)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px 28px;align-items:start}
.card-grid h3{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.res{width:100%;border-collapse:collapse;font-size:13px}
.res td{padding:5px 0;border-bottom:1px solid var(--line-soft);vertical-align:top;white-space:normal}
.res td.v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
.res td.v span{color:var(--faint)}
.res .who{display:flex;flex-direction:column;gap:3px;min-width:0}
.res .who small{color:var(--muted);font-size:11.5px}
.res .who small em{font-style:normal;color:var(--ink);font-weight:600}
.track{height:5px;border-radius:3px;background:var(--line-soft);overflow:hidden}
.track i{display:block;height:100%;border-radius:3px}
.foot{font-size:12px;color:var(--muted);margin-top:6px}
.proto-wrap{grid-column:1 / -1;overflow-x:auto}
.proto{width:100%;border-collapse:collapse;font-size:13px}
.proto th{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);text-align:right;padding:0 0 6px 12px;white-space:nowrap}
.proto td{padding:4px 0;border-bottom:1px solid var(--line-soft);color:var(--muted);white-space:normal}
.proto td.no{color:var(--faint);font-family:var(--mono);font-size:11px;width:2.2em}
.proto td.v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink);padding-left:12px;white-space:nowrap}
.proto td.d{color:var(--ink);font-weight:500}
.grid thead td{cursor:pointer}
.grid thead td:hover{text-decoration:underline}
.grid td.open{box-shadow:inset 0 -2px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Протоколы УИК</h1>
    <div class="sub"><span id="meta"></span> · данные: <a href="https://deg.zhizhin.xyz/shpilkin.html" target="_blank" rel="noopener">deg.zhizhin.xyz/shpilkin.html</a></div>
  </header>

  <section class="filters" aria-label="Фильтры">
    <div class="f">
      <label for="region">Область</label>
      <select id="region"></select>
    </div>
    <div class="f">
      <div class="lblrow"><label for="district">Округ</label><a id="districtLink" href="#" target="_blank" rel="noopener" hidden></a></div>
      <select id="district"></select>
    </div>
    <div class="f wide">
      <label for="tikq">ТИК</label>
      <div class="tikrow">
        <input type="text" id="tikq" placeholder="Поиск по названию" autocomplete="off">
        <select id="tik"></select>
      </div>
    </div>
    <div class="f">
      <span class="lbl"><i class="sw" style="background:var(--c-pw)"></i>ЕР, кандидат, %</span>
      <div class="range"><input type="number" id="pwMin" min="0" max="100" step="1" placeholder="от 0" aria-label="ЕР кандидат от"><span>–</span><input type="number" id="pwMax" min="0" max="100" step="1" placeholder="до 100" aria-label="ЕР кандидат до"></div>
    </div>
    <div class="f">
      <span class="lbl"><i class="sw" style="background:var(--c-pk)"></i>pick, %</span>
      <div class="range"><input type="number" id="pkMin" min="0" max="100" step="1" placeholder="от 0" aria-label="pick от"><span>–</span><input type="number" id="pkMax" min="0" max="100" step="1" placeholder="до 100" aria-label="pick до"></div>
    </div>
    <div class="f">
      <span class="lbl"><i class="sw" style="background:var(--c-tp)"></i>Явка, %</span>
      <div class="range"><input type="number" id="tpMin" min="0" max="100" step="1" placeholder="от 0" aria-label="Явка от"><span>–</span><input type="number" id="tpMax" min="0" max="100" step="1" placeholder="до 100" aria-label="Явка до"></div>
    </div>
    <div class="f">
      <label for="denom">Процент от</label>
      <select id="denom">
        <option value="part">принявших участие</option>
        <option value="valid">действительных бюллетеней</option>
        <option value="list">числа избирателей в списке</option>
      </select>
    </div>
    <div class="f">
      <div class="checks">
        <label><input type="checkbox" id="hideDeg"> Без ДЭГ</label>
        <button type="button" class="ghost" id="reset">Сбросить фильтры</button>
      </div>
    </div>
  </section>

  <nav class="crumbs" id="crumbs" aria-label="Уровень"></nav>
  <section class="stats" id="stats" aria-label="Итоги по выборке"></section>

  <section class="panel">
    <div class="panel-h">
      <h2 id="chartTitle">Результаты по участкам</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <div class="legend" id="legend"></div>
        <div class="seg" role="group" aria-label="Шкала">
          <button type="button" id="modePct" aria-pressed="true">%</button>
          <button type="button" id="modeVotes" aria-pressed="false">голоса</button>
        </div>
        <div class="seg" role="group" aria-label="Размер точек">
          <button type="button" id="sizeFixed" aria-pressed="true">точки</button>
          <button type="button" id="sizeVotes" aria-pressed="false">размер по голосам</button>
        </div>
      </div>
    </div>
    <div class="chartbox" id="chartbox">
      <canvas id="cv"></canvas><canvas id="ov"></canvas>
      <div class="tip" id="tip" hidden></div>
      <div class="empty" id="empty" hidden>Под фильтры не попал ни один участок — ослабьте диапазоны или сбросьте фильтры.</div>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <section class="panel" id="uikPanel" hidden aria-live="polite"></section>

  <section class="panel" id="tablePanel">
    <div class="panel-h"><h2 id="tableTitle"></h2><span class="hint" id="tableHint"></span></div>
    <div class="tscroll" id="tableBox"></div>
  </section>
</div>

<script>
const D = /*DATA*/null;
const C = D.cols, N = C.t.length;
const tikRegion = D.tiks.map(t => t[0]), tikName = D.tiks.map(t => t[1]);
const tikLower = tikName.map(s => s.toLowerCase());

const SERIES = [
  {id:'pw', label:'ЕР, кандидат', color:'--c-pw', pct:'pwp', votes:'pw', base:'va'},
  {id:'er', label:'ЕР, список', color:'--c-er', pct:'erp', votes:'er', base:'fv'},
  {id:'pk', label:'pick', color:'--c-pk', pct:'pkp', votes:'pk', base:'va'},
  {id:'tp', label:'Явка', color:'--c-tp', pct:'tp', votes:'i', base:'v'},
];

const $ = id => document.getElementById(id);
const fmtInt = n => n.toLocaleString('ru-RU');
const fmtPct = bp => bp < 0 ? '—' : (bp / 100).toFixed(2).replace('.', ',');
const fmtShare = (a, b) => b > 0 ? (a / b * 100).toFixed(2).replace('.', ',') + '%' : '—';

const DEFAULT = {region:0, district:-1, tik:null, tikq:'', pwMin:'', pwMax:'', pkMin:'', pkMax:'', tpMin:'', tpMax:'', hideDeg:false, mode:'pct', size:'fixed', denom:'part', show:{pw:true, er:true, pk:true, tp:false}};
let S = structuredClone(DEFAULT);
let openRow = -1, openPos = -1, pendingUik = 0;
try { const saved = JSON.parse(localStorage.getItem('uik-state') || 'null'); if (saved) S = Object.assign(S, saved, {show:Object.assign({}, DEFAULT.show, saved.show)}); } catch (e) {}
readUrl();
if (S.tik === null) S.tik = D.tiks.findIndex(t => t[0] === S.region);
const save = () => { try { localStorage.setItem('uik-state', JSON.stringify(S)); } catch (e) {} writeUrl(); };

function readUrl(){
  let p;
  try { p = new URLSearchParams(location.search); } catch (e) { return; }
  if (![...p.keys()].length) return;
  S = Object.assign(structuredClone(DEFAULT), {mode:S.mode, size:S.size, show:S.show});
  const region = p.get('region');
  S.region = region ? D.regions.indexOf(region) : -1;
  const okrug = +p.get('okrug');
  const row = okrug ? C.d.indexOf(okrug) : -1;
  if (row >= 0) { S.district = okrug; S.region = tikRegion[C.t[row]]; }
  const tik = p.get('tik');
  S.tik = tik ? D.tiks.findIndex((t, i) => t[1] === tik && (S.region < 0 || t[0] === S.region)) : -1;
  if (S.tik >= 0) S.region = tikRegion[S.tik];
  S.tikq = p.get('q') || '';
  for (const [key, lo, hi] of [['pw', 'pwMin', 'pwMax'], ['pk', 'pkMin', 'pkMax'], ['tp', 'tpMin', 'tpMax']]) {
    const m = (p.get(key) || '').match(/^\s*(\d+(?:[.,]\d+)?)?\s*-\s*(\d+(?:[.,]\d+)?)?\s*$/);
    if (m) { S[lo] = (m[1] || '').replace(',', '.'); S[hi] = (m[2] || '').replace(',', '.'); }
  }
  S.hideDeg = p.get('nodeg') === '1';
  pendingUik = +p.get('uik') || 0;
  if (p.has('scale')) S.mode = p.get('scale') === 'votes' ? 'votes' : 'pct';
  if (p.has('base')) S.denom = ['valid', 'list'].includes(p.get('base')) ? p.get('base') : 'part';
  if (p.has('size')) S.size = p.get('size') === 'votes' ? 'votes' : 'fixed';
  if (p.has('show')) { const on = p.get('show').split(','); S.show = Object.fromEntries(SERIES.map(s => [s.id, on.includes(s.id)])); }
}
function writeUrl(){
  const p = new URLSearchParams();
  if (S.region >= 0) p.set('region', D.regions[S.region]);
  if (S.district >= 0) p.set('okrug', S.district);
  if (S.tik >= 0) p.set('tik', tikName[S.tik]);
  if (S.tikq.trim()) p.set('q', S.tikq.trim());
  if (S.pwMin !== '' || S.pwMax !== '') p.set('pw', `${S.pwMin}-${S.pwMax}`);
  if (S.pkMin !== '' || S.pkMax !== '') p.set('pk', `${S.pkMin}-${S.pkMax}`);
  if (S.tpMin !== '' || S.tpMax !== '') p.set('tp', `${S.tpMin}-${S.tpMax}`);
  if (S.hideDeg) p.set('nodeg', '1');
  if (openRow >= 0) {
    if (S.region < 0) p.set('region', D.regions[tikRegion[C.t[openRow]]]);
    p.set('uik', C.u[openRow]);
  }
  if (S.mode === 'votes') p.set('scale', 'votes');
  if (S.size === 'votes') p.set('size', 'votes');
  if (S.denom !== 'part') p.set('base', S.denom);
  const shown = SERIES.filter(s => S.show[s.id]).map(s => s.id).join(',');
  if (shown !== 'pw,er,pk') p.set('show', shown);
  const qs = p.toString();
  try { history.replaceState(null, '', qs ? '?' + qs : location.pathname); } catch (e) {}
}

// ---------- percentages ----------
C.bw = new Array(N); C.be = new Array(N);
const DENOM = {
  part:{w:'sp', e:'fp', label:'от принявших участие (действительные + недействительные)'},
  valid:{w:'va', e:'fv', label:'от действительных бюллетеней'},
  list:{w:'v', e:'v', label:'от числа избирателей в списке'},
};
function applyDenom(){
  const d = DENOM[S.denom] || DENOM.part;
  const bp = (votes, base) => votes >= 0 && base > 0 ? Math.round(votes / base * 10000) : -1;
  for (let i = 0; i < N; i++) {
    const bw = C[d.w][i], be = C[d.e][i];
    C.bw[i] = bw; C.be[i] = be;
    C.pwp[i] = bp(C.pw[i], bw); C.pkp[i] = bp(C.pk[i], bw); C.erp[i] = bp(C.er[i], be);
  }
}
applyDenom();

// ---------- controls ----------
const regionSel = $('region'), districtSel = $('district'), tikSel = $('tik'), tikq = $('tikq');
regionSel.innerHTML = '<option value="-1">Все области</option>' + D.regions.map((r, i) => `<option value="${i}">${esc(r)}</option>`).join('');
function shortName(n){ if (!n) return ''; const [last, ...rest] = n.split(' '); return [last, ...rest.map(w => w[0] + '.')].join(' '); }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

const tikDistricts = D.tiks.map(() => new Set());
for (let i = 0; i < N; i++) {
  tikDistricts[C.t[i]].add(C.d[i]);
}
const districtInfo = new Map();
for (let i = 0; i < N; i++) if (!districtInfo.has(C.d[i])) districtInfo.set(C.d[i], {region:tikRegion[C.t[i]], pw:D.names[C.nw[i]], pk:D.names[C.nk[i]]});
const districtNums = [...districtInfo.keys()].sort((a, b) => a - b);
function fillDistrictSelect(){
  const list = districtNums.filter(d => S.region < 0 || districtInfo.get(d).region === S.region);

    const pctCell = (v, c) => v < 0 ? '—' : `${(v * 100).toFixed(2).replace('.', ',')}<span class="bar" style="width:${Math.round(v * 60)}px;background:var(${c})"></span>`;
    tb.innerHTML = `<table class="groups"><thead><tr>${cols.map(([k, l]) => `<th data-k="${k}"${k === sortKey ? ` aria-sort="${sortDir > 0 ? 'ascending' : 'descending'}"` : ''}>${l}</th>`).join('')}</tr></thead><tbody>${
      rows.map(r => `<tr data-key="${r.g.key}"><td>${esc(r.name)}</td><td>${fmtInt(r.n)}</td><td>${fmtInt(r.v)}</td><td>${pctCell(r.tp,'--c-tp')}</td><td>${pctCell(r.pw,'--c-pw')}</td><td>${pctCell(r.er,'--c-er')}</td><td>${pctCell(r.pk,'--c-pk')}</td></tr>`).join('')
    }</tbody></table>`;
    return;
  }
  $('tableTitle').textContent = 'Участки ТИК';
  $('tableHint').textContent = 'По горизонтали — УИК по порядку, по вертикали — результаты, %';
  const cell = (bp, c) => bp < 0 ? '<td>—</td>' : `<td style="background:color-mix(in srgb,var(${c}) ${Math.round(bp / 100 * .55)}%,transparent)">${fmtPct(bp)}</td>`;
  const lines = [
    ['УИК', r => `<td data-row="${r}" class="${C.f[r] & 1 ? 'deg' : ''}${r === openRow ? ' open' : ''}" title="${C.f[r] & 1 ? 'ДЭГ · ' : ''}Полный протокол">${C.u[r]}</td>`, true],
    ...SERIES.filter(s => S.show[s.id]).map(s => [`<i class="sw" style="background:var(${s.color})"></i> ${s.label}`, r => cell(C[s.pct][r], s.color)]),
    ['Избирателей', r => `<td>${C.v[r] >= 0 ? fmtInt(C.v[r]) : '—'}</td>`],
    ['Голоса ЕР, канд.', r => `<td>${C.pw[r] >= 0 ? fmtInt(C.pw[r]) : '—'}</td>`],
    ['Голоса pick', r => `<td>${C.pk[r] >= 0 ? fmtInt(C.pk[r]) : '—'}</td>`],
  ];
  tb.innerHTML = `<table class="grid">${lines.map(([label, f, head]) => {
    const tr = `<tr><th scope="row">${label}</th>${sel.map(f).join('')}</tr>`;
    return head ? `<thead>${tr}</thead>` : tr; }).join('')}</table>`;
}
$('tableBox').addEventListener('click', e => {
  const th = e.target.closest('th[data-k]');
  if (th) { const k = th.dataset.k; sortDir = sortKey === k ? -sortDir : (k === 'name' ? 1 : -1); sortKey = k; renderTable(); return; }
  const uc = e.target.closest('td[data-row]');
  if (uc) { openUik(+uc.dataset.row); return; }
  const tr = e.target.closest('tr[data-key]'); if (!tr) return;
  const key = +tr.dataset.key;
  if (groupBy === 'region') { S.region = key; S.district = -1; S.tik = -1; } else { S.tik = key; S.region = tikRegion[key]; }
  syncControls(); update(); window.scrollTo({top:0, behavior:'smooth'});
});
let lastCell = null;
function markCell(){
  if (lastCell) { lastCell.forEach(c => c.classList.remove('hl')); lastCell = null; }
  if (groupBy || hoverPos < 0) return;
  const t = $('tableBox').querySelector('table.grid'); if (!t) return;
  lastCell = [...t.rows].map(tr => tr.cells[hoverPos + 1]).filter(Boolean);
  lastCell.forEach(c => c.classList.add('hl'));
  const c0 = lastCell[0], box2 = $('tableBox');
  if (c0) { const l = c0.offsetLeft - box2.clientWidth / 2; box2.scrollLeft = l; }
}

// ---------- UIK card ----------
const PARTIES = ['Родина', 'Единая Россия', 'КПРФ', 'Партия пенсионеров', 'Новые люди', 'Партия прямой демократии', 'Зелёные', 'Коммунисты России', 'ЛДПР', 'Справедливая Россия'];
const LINES = ['Избирателей в списке', 'Получено бюллетеней', 'Выдано досрочно', 'Выдано в помещении', 'Выдано вне помещения', 'Погашено', 'В переносных ящиках', 'В стационарных ящиках', 'Недействительных', 'Действительных', 'Утраченных', 'Не учтённых при получении'];
const DETAIL_VERSION = '/*DETAIL_VERSION*/';
const detailCache = new Map();
function loadDistrict(d){
  if (!detailCache.has(d)) {
    const p = fetch(`detail/${d}.json?v=${DETAIL_VERSION}`).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); });
    p.catch(() => detailCache.delete(d));
    detailCache.set(d, p);
  }
  return detailCache.get(d);
}
const share = (a, b) => b > 0 ? (a / b * 100).toFixed(2).replace('.', ',') + '%' : '—';
function resultRows(items, base){
  const max = Math.max(1, ...items.map(x => x.v));
  return `<table class="res"><tbody>${items.sort((a, b) => b.v - a.v).map(x => `<tr><td><div class="who"><span>${esc(x.name)}</span>${x.note ? `<small>${x.note}</small>` : ''}<div class="track"><i style="width:${(x.v / max * 100).toFixed(1)}%;background:var(${x.color})"></i></div></div></td><td class="v">${share(x.v, base)}<br><span>${fmtInt(x.v)}</span></td></tr>`).join('')}</tbody></table>`;
}
function renderCard(r, det, err){
  const panel = $('uikPanel'), d = C.d[r], u = det && det.uiks[String(C.u[r])];
  const f = C.f[r], tags = [];
  if (f & 1) tags.push('<span class="tag warn">ДЭГ</span>');
  if (f & 2) tags.push('<span class="tag warn">повторный протокол</span>');
  if (f & 4) tags.push('<span class="tag warn">источник: не ЦИК API</span>');
  tags.unshift(`<span class="tag">явка <b>${fmtPct(C.tp[r])}%</b></span>`, `<span class="tag">избирателей <b>${fmtInt(C.v[r])}</b></span>`);
  let body;
  if (err) body = `<p class="hint">Не удалось загрузить протокол округа №${d}. Проверьте соединение и откройте участок ещё раз.</p>`;
  else if (!det) body = '<p class="hint">Загружаю протокол…</p>';
  else if (!u) body = '<p class="hint">Полного протокола этого участка в данных нет.</p>';
  else {
    const [l, votes, fed] = u;
    const baseSingle = S.denom === 'valid' ? l[9] : S.denom === 'list' ? l[0] : l[8] + l[9];
    const fl = fed && fed.slice(0, 12), fv = fed && fed.slice(12);
    const baseFed = !fed ? 0 : S.denom === 'valid' ? fl[9] : S.denom === 'list' ? fl[0] : fl[8] + fl[9];
    const cands = det.cands.map(([name, party, fl], i) => ({
      name, v:votes[i],
      note:[esc(party), fl & 1 ? '<em>кандидат власти</em>' : '', fl & 2 ? '<em>pick</em>' : ''].filter(Boolean).join(' · '),
      color:fl & 1 ? '--c-pw' : fl & 2 ? '--c-pk' : '--faint'}));
    const parties = fed ? PARTIES.map((name, i) => ({name, v:fv[i], color:name === 'Единая Россия' ? '--c-er' : '--faint'})) : null;
    body = `<div class="card-grid">
      <div><h3>Одномандатный округ №${d}</h3>${resultRows(cands, baseSingle)}<div class="foot">Процент ${DENOM[S.denom].label}: ${fmtInt(baseSingle)}</div></div>
      <div><h3>Федеральный список</h3>${parties ? resultRows(parties, baseFed) + `<div class="foot">Процент ${DENOM[S.denom].label}: ${fmtInt(baseFed)} · действительных ${fmtInt(fl[9])}, недействительных ${fmtInt(fl[8])}</div>` : '<p class="hint">Федерального протокола этого участка в данных нет.</p>'}</div>
      <div class="proto-wrap"><h3>Протокол</h3><table class="proto"><thead><tr><th></th><th></th><th>Одномандатный</th><th>Федеральный</th><th>Разница</th></tr></thead><tbody>${LINES.map((name, i) => {
        const a = l[i], b = fl ? fl[i] : null, delta = b === null ? 0 : b - a;
        return `<tr><td class="no">${i + 1}</td><td>${name}</td><td class="v">${fmtInt(a)}</td><td class="v">${b === null ? '—' : fmtInt(b)}</td><td class="v d">${delta ? (delta > 0 ? '+' : '−') + fmtInt(Math.abs(delta)) : ''}</td></tr>`;
      }).join('')}</tbody></table><div class="foot">Разница — федеральный минус одномандатный. Федеральных обычно больше: например, избиратели, голосующие не по месту регистрации, получают только федеральный бюллетень.</div></div>
    </div>`;
  }
  panel.innerHTML = `<div class="card-h"><div><h2>УИК №${C.u[r]}</h2>
    <div class="sub">${esc(D.regions[tikRegion[C.t[r]]])} · ${esc(tikName[C.t[r]])} · <a href="https://iditena.ru/districts/${d}/" target="_blank" rel="noopener">округ №${d}</a>${det ? ' ' + esc(det.name.split(' – ').pop()) : ''}</div></div>
    <button type="button" class="card-close" id="uikClose" aria-label="Закрыть карточку участка">×</button></div>
    <div class="tags">${tags.join('')}</div>${body}`;
  panel.hidden = false;
  $('uikClose').onclick = closeUik;
}
function openUik(r){
  openRow = r; openPos = sel.indexOf(r);
  renderCard(r, null);
  $('uikPanel').scrollIntoView({block:'nearest', behavior:'smooth'});
  loadDistrict(C.d[r]).then(det => { if (openRow === r) renderCard(r, det); }, () => { if (openRow === r) renderCard(r, null, true); });
  drawHover(); renderTable(); save();
}
function closeUik(){
  openRow = -1; openPos = -1;
  $('uikPanel').hidden = true;
  drawHover(); renderTable(); save();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openRow >= 0) closeUik(); });

// ---------- main ----------
function update(){
  select();
  groupStarts = new Set(groups.map(g => g.start));
  hoverPos = -1;
  if (openRow >= 0) { openPos = groupBy ? -1 : sel.indexOf(openRow); if (openPos < 0) { openRow = -1; $('uikPanel').hidden = true; } }
  $('chartTitle').textContent = groupBy ? (groupBy === 'region' ? 'Все участки по областям' : 'Участки по ТИК') : 'Результаты по участкам';
  renderCrumbs(); renderStats(); draw(); renderTable(); save();
}
new ResizeObserver(() => draw()).observe(box);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => draw());
new MutationObserver(() => draw()).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
syncControls(); update();
if (pendingUik) {
  const r = sel.find(i => C.u[i] === pendingUik);
  if (r !== undefined) {
    if (groupBy) { S.tik = C.t[r]; S.region = tikRegion[C.t[r]]; syncControls(); update(); }
    openUik(r);
  }
}
if (document.fonts) document.fonts.ready.then(() => draw());
</script>
